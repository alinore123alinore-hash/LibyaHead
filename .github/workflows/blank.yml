name: Build LibyaHead APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - uses: android-actions/setup-android@v3

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/libyahead

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LibyaHead"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.libyahead"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.libyahead"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="LibyaHead">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/libyahead/MainActivity.kt <<'EOF'
          package com.libyahead

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(24, 32, 24, 24)

                  val title = TextView(this)
                  title.text = "LibyaHead - ألعابي"
                  title.textSize = 26f
                  layout.addView(title)

                  val list = ListView(this)
                  layout.addView(list)

                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN)
                  intent.addCategory(Intent.CATEGORY_LAUNCHER)

                  val apps = pm.queryIntentActivities(intent, 0)
                      .sortedBy { it.loadLabel(pm).toString() }

                  val names = apps.map {
                      it.loadLabel(pm).toString()
                  }

                  list.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_list_item_1,
                      names
                  )

                  list.setOnItemClickListener { _, _, position, _ ->
                      val packageName =
                          apps[position].activityInfo.packageName
                      pm.getLaunchIntentForPackage(packageName)?.let {
                          startActivity(it)
                      }
                  }

                  setContentView(layout)
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibyaHead-APK
          path: app/build/outputs/apk/debug/app-debug.apk
